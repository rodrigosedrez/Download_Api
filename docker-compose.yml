version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: aspnet_api
    restart: always
    ports:
      - "7023:80"   # API acessível em http://localhost:7023
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80

      # --- BANCO DE DADOS ---
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=DownloadsAPIDocker;User Id=SA;Password=You12Pass34.;Encrypt=True;TrustServerCertificate=True;

      # --- REDIS ---
      ConnectionStrings__RedisConnection: ${REDIS_HOST}:${REDIS_PORT},password=${REDIS_PASSWORD},abortConnect=false

      # --- CLOUDFLARE R2 ---
 

      # --- SEGURANÇA (JWT / CORS) ---
      Jwt__Issuer: FreeTrained
      Jwt__Audience: LooneyDownloadApi
      Jwt__ExpiryMinutes: 1200
      Jwt__Key: ${JWT_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

    networks:
      - api_net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: always
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - api_net

  redis:
    image: redis:7.0-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - api_net

volumes:
  sql_data:
  redis_data:

networks:
  api_net:
    driver: bridge
